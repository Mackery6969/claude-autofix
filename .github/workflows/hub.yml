name: Deploy hub

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/hub-deploy.ts"
      - "scripts/deploy-hub.ts"
      - "examples/runner.yml"
      - ".github/workflows/hub.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: claude-autofix-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_HUB: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLAUDE_AUTOFIX_HUB_SECRET != '' && vars.CLAUDE_AUTOFIX_RUNNER != '' }}
    steps:
      - name: Check the hub is set up
        if: env.HAS_HUB != 'true'
        run: echo "::notice::No hub to deploy yet. Add the CLOUDFLARE_API_TOKEN secret and run node scripts/setup-hub.ts once."
      - id: runner
        if: env.HAS_HUB == 'true'
        env:
          RUNNER: ${{ vars.CLAUDE_AUTOFIX_RUNNER }}
        run: echo "name=${RUNNER#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        if: env.HAS_HUB == 'true'
        with:
          client-id: ${{ vars.CLAUDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.runner.outputs.name }},${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_HUB == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.HAS_HUB == 'true'
        with:
          node-version: 24
      - name: Deploy the hub and update the runner
        if: env.HAS_HUB == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_APP_CLIENT_ID: ${{ vars.CLAUDE_APP_CLIENT_ID }}
          CLAUDE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CLAUDE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_AUTOFIX_RUNNER: ${{ vars.CLAUDE_AUTOFIX_RUNNER }}
          CLAUDE_AUTOFIX_OWNERS: ${{ vars.CLAUDE_AUTOFIX_OWNERS }}
          CLAUDE_AUTOFIX_IGNORED: ${{ vars.CLAUDE_AUTOFIX_IGNORED }}
          CLAUDE_AUTOFIX_HUB_SECRET: ${{ secrets.CLAUDE_AUTOFIX_HUB_SECRET }}
          CLAUDE_AUTOFIX_WEBHOOK_SECRET: ${{ secrets.CLAUDE_AUTOFIX_WEBHOOK_SECRET }}
          CLAUDE_AUTOFIX_ADMIN_SECRET: ${{ secrets.CLAUDE_AUTOFIX_ADMIN_SECRET }}
        run: node scripts/deploy-hub.ts
