name: Code quality

on:
  schedule:
    - cron: "17 18 * * 0"
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      area:
        description: Folder to work on now (empty continues where the last pass stopped)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: claude-code-quality-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./
        with:
          task: quality
          claude-code-oauth-token: ${{ github.event_name != 'pull_request' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          area: ${{ inputs.area }}
          verify-command: npm run typecheck && npm test
