name: Security

on:
  workflow_run:
    workflows: ["CodeQL", "Automatic Dependency Submission", "Dependency Graph", "Dependabot Updates"]
    types: [completed]
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "57 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Take everything on again, even what earlier pull requests already covered
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write
  actions: write
  checks: read

concurrency:
  group: claude-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    if: ${{ !(startsWith(github.head_ref, 'claude/') && github.event.action != 'closed') && !startsWith(github.event.workflow_run.head_branch, 'claude/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./
        with:
          task: security
          claude-code-oauth-token: ${{ github.event_name != 'pull_request' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          force: ${{ inputs.force == true }}
          verify-command: npm run typecheck && npm test
