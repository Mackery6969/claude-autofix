name: Security

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Triage again even if an earlier pull request covered these findings
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: write
  checks: read

concurrency:
  group: claude-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./
        with:
          task: security
          claude-code-oauth-token: ${{ github.event_name != 'pull_request' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          force: ${{ inputs.force == true }}
          verify-command: npm run typecheck && npm test
