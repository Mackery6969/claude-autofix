name: Code quality

on:
  schedule:
    - cron: "17 6 * * 4"
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      area:
        description: Folder to work on now (empty continues where the last pass stopped)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: claude-code-quality-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  quality:
    if: ${{ !(startsWith(github.head_ref, 'claude/') && github.event.action != 'closed') && !startsWith(github.event.workflow_run.head_branch, 'claude/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false
      - uses: Mackery6969/Claude-Autofix@v2
        with:
          task: quality
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          area: ${{ inputs.area }}
          verify-command: npm ci && npm test
