name: Claude resume

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: claude-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: Mackery6969/Claude-Autofix@v1
        with:
          task: resume
          github-token: ${{ steps.app.outputs.token || github.token }}
