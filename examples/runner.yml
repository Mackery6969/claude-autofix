name: Claude Autofix

on:
  workflow_call:
    inputs:
      task:
        type: string
        required: true
      repository:
        type: string
        required: true
      ref:
        type: string
        default: ""
      sha:
        type: string
        default: ""
      before:
        type: string
        default: ""
      pull-request:
        type: string
        default: ""
      issue:
        type: string
        default: ""
      sender:
        type: string
        default: ""
      cursor:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.task == 'quality' && 60 || 355 }}
    steps:
      - id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::repository must be owner/name"
            exit 1
          fi
          echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.CLAUDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha || inputs.ref }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: Mackery6969/Claude-Autofix@v3
        with:
          task: ${{ inputs.task }}
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          sha: ${{ inputs.sha }}
          before: ${{ inputs.before }}
          pull-request: ${{ inputs.pull-request }}
          issue: ${{ inputs.issue }}
          sender: ${{ inputs.sender }}
          cursor: ${{ inputs.cursor }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.app.outputs.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          hub-url: ${{ vars.CLAUDE_AUTOFIX_HUB_URL }}
          hub-secret: ${{ secrets.CLAUDE_AUTOFIX_HUB_SECRET }}
