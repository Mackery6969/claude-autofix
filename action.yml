name: "Claude Autofix"
description: "Has Claude fix code scanning alerts and issues, and make weekly code-quality passes, as Dependabot-style pull requests, pausing on usage limits."
author: "Mackery"

inputs:
  task:
    description: "What to do: security (fix or dismiss open code scanning alerts and work on issues), quality (one code-quality pass) or resume (restart runs paused by a usage limit)."
    required: true
  claude-code-oauth-token:
    description: "Token for your Claude subscription, from `claude setup-token`. Without it (or anthropic-api-key) Claude is off for this repository."
    default: ""
  anthropic-api-key:
    description: "Anthropic API key, billed per use. Alternative to claude-code-oauth-token."
    default: ""
  github-token:
    description: "Token for the GitHub API and for pushing branches. Pass a GitHub App token here (with app-slug) so Claude's work shows up as your app."
    default: ${{ github.token }}
  app-slug:
    description: "Slug of the GitHub App whose token is in github-token, from actions/create-github-app-token. Commits are then made as <slug>[bot], and workflow files can be changed."
    default: ""
  pr-token:
    description: "Optional personal access token to push and open pull requests with, instead of github-token. A GitHub App is the better choice."
    default: ""
  model:
    description: "Claude model. Defaults to claude-opus-5-5 for security and claude-sonnet-5-5 for quality."
    default: ""
  max-budget-usd:
    description: "Stop Claude once a run has used this much (API-equivalent). Defaults to 5 for security and 3 for quality."
    default: ""
  verify-command:
    description: "Shell commands that must pass after Claude's changes (typecheck, tests). Runs from the repository root with bash. Empty skips verification."
    default: ""
  branch-prefix:
    description: "Folder for Claude's branches. Each branch is named after its change, like claude/quality/use-a-guard-clause-in-load-env. Defaults to claude/security or claude/quality."
    default: ""
  labels:
    description: "Pull request labels, one per line or comma-separated."
    default: ""
  force:
    description: "security: triage findings earlier pull requests covered, replacing an open one. quality: start a pass even if the last one is still open."
    default: "false"
  resume-workflow:
    description: "File name of this repository's resume workflow, turned on when a run pauses."
    default: "claude-resume.yml"
  code-scanning-tools:
    description: "security: which scanners' code scanning alerts to work on (such as CodeQL or GML Code Scanner), one per line. all takes every scanner; none works on issues only."
    default: "all"
  max-findings:
    description: "security: most alerts and issues in one pull request. Related items are grouped, and a run opens as many pull requests as it needs."
    default: "10"
  grouping-model:
    description: "security: model that groups related alerts and issues into pull requests. A small, cheap model is enough."
    default: "claude-haiku-5-5"
  time-budget-minutes:
    description: "Stop starting new groups after this many minutes; the next run picks up the rest. Keep it below the job's timeout-minutes."
    default: "300"
  issues:
    description: "security: also work on open issues whose labels are in issue-labels."
    default: "true"
  dependabot-alerts:
    description: "security: also triage open Dependabot alerts that Dependabot can't fix itself: fix, dismiss (adding a dependabot.yml exclusion where it helps) or escalate in an issue. A GitHub App token needs the Dependabot alerts permission."
    default: "true"
  issue-labels:
    description: "security: issue labels to work on, most severe first, one per line. Issues labelled question, duplicate, invalid or wontfix are always skipped."
    default: "security, critical, bug, accessibility, polishing, enhancement"
  areas:
    description: "quality: folders to work through, one per line. Empty means the whole repository."
    default: ""
  area:
    description: "quality: work on this folder now instead of continuing where the last pass stopped."
    default: ""
  exclude:
    description: "quality: paths Claude must not change (vendored code, generated files), one per line."
    default: ""
  extensions:
    description: "quality: file extensions that count as source code, separated by spaces or commas. Defaults to common programming languages."
    default: ""
  batch-lines:
    description: "quality: roughly how many lines of code one pass covers. Larger passes cost more usage and make bigger pull requests."
    default: "1500"
  pull-request-mode:
    description: "On pull requests: commit (push fixes to the pull request's branch) or pull-request (open a separate pull request into it)."
    default: "commit"
  pull-request-authors:
    description: "On pull requests: only let Claude change pull requests opened by these users, one per line. Others get a findings comment. Defaults to the repository owner."
    default: ""
  instructions:
    description: "quality: extra guidance for this repository, added to the prompt."
    default: ""

outputs:
  files:
    description: "quality: how many files this pass covered."
  pull-request-url:
    description: "The pull request that was opened or updated, if any."
  branch:
    description: "The branch that pull request comes from."
  paused:
    description: "true when Claude hit a usage limit and the run paused."
  resume-at:
    description: "When a paused run starts again (ISO 8601)."
  claude-cost-usd:
    description: "What the Claude run would cost at API prices."
  resumed:
    description: "resume: how many paused runs were started again."

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "shield"
  color: "orange"
